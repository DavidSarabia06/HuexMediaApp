nav:
  - Inicio: README.md
  - Frontend:
      - Visión general: frontend/README.md
      - Aplicación:
          - Estructura, rutas y temas: frontend/app.md
          - Código JSX: codigo/App.md
      - Módulos:
          - subtitles:
              - Interpretación y pistas: frontend/modulos/subtitles.md
              - Código JavaScript: codigo/Subtitles.md
          - playbackProgress:
              - Funciones y guardado: frontend/modulos/playback-progress.md
              - Código JavaScript: codigo/PlaybackProgressClient.md
      - Páginas:
          - Movies:
              - Categorías y subcategorías: frontend/paginas/movies.md
              - Código JSX: codigo/MoviesPage.md
          - Settings:
              - Página de configuración: frontend/paginas/settings.md
              - Código JSX: codigo/Settings.md
          - Home:
              - Biblioteca y navegación: frontend/paginas/home.md
              - Código JSX: codigo/Home.md
          - Series:
              - Funcionamiento y propiedades: frontend/paginas/series.md
              - Código JSX: codigo/SeriesPage.md
          - SeriesDetail:
              - Funcionamiento y navegación: frontend/paginas/series-detail.md
              - Código JSX: codigo/SeriesDetail.md
          - VideoPlayer:
              - Funcionamiento y eventos: frontend/paginas/video-player.md
              - Código JSX: codigo/VideoPlayer.md
              - Estilos CSS: codigo/VideoPlayerStyles.md
      - Componentes:
          - Header:
              - Funcionamiento y eventos: frontend/componentes/header.md
              - Código JSX: codigo/Header.md
              - Estilos CSS: codigo/HeaderStyles.md
          - HuexCard:
              - Funcionamiento y propiedades: frontend/componentes/huex-card.md
              - Código JSX: codigo/HuexCard.md
              - Estilos CSS: codigo/HuexCardStyles.md
          - HuexCardMenu:
              - Funcionamiento y propiedades: frontend/componentes/huex-card-menu.md
              - Código JSX: codigo/HuexCardMenu.md
          - SeriesCategoryRow:
              - Funcionamiento y propiedades: frontend/componentes/series-category-row.md
              - Código JSX: codigo/SeriesCategoryRow.md
  - Sistemas:
      - Categorías de series:
          - Visión general: sistemas/categorias-series/README.md
          - Servicio:
              - Funciones y funcionamiento: sistemas/categorias-series/servicio.md
              - Código fuente: codigo/SeriesCategoryService.md
          - Modelos:
              - Clases y propiedades: sistemas/categorias-series/modelos.md
              - Código fuente: codigo/SeriesCategory.md
          - Controlador:
              - Operaciones y respuestas: sistemas/categorias-series/controlador.md
              - Código fuente: codigo/SeriesCategoriesController.md
      - Configuración:
          - Visión general: sistemas/configuracion/README.md
          - Servicio:
              - Funciones y funcionamiento: sistemas/configuracion/servicio.md
              - Código fuente: codigo/ConfigurationService.md
          - Modelo:
              - Propiedades: sistemas/configuracion/modelos.md
              - Código fuente: codigo/ConfigurationRequest.md
          - Controlador:
              - Operaciones y respuestas: sistemas/configuracion/controlador.md
              - Código fuente: codigo/ConfigurationController.md
      - Exploración de series:
          - Visión general: sistemas/series/README.md
          - Servicio:
              - Funciones y funcionamiento: sistemas/series/servicio.md
              - Código fuente: codigo/SeriesService.md
          - Modelos:
              - Clases y propiedades: sistemas/series/modelos.md
              - Código fuente: codigo/SeriesLibrary.md
          - Controlador:
              - Operaciones y respuestas: sistemas/series/controlador.md
              - Código fuente: codigo/SeriesController.md
      - Reproducción de vídeo:
          - Visión general: sistemas/reproduccion-video/README.md
          - Sincronización de tiempos: sistemas/reproduccion-video/sincronizacion.md
          - Eventos:
              - Mapa general: sistemas/reproduccion-video/eventos/README.md
              - 01 · Consultar información: sistemas/reproduccion-video/eventos/consultar-informacion.md
              - 02 · Iniciar reproducción: sistemas/reproduccion-video/eventos/iniciar-reproduccion.md
              - 03 · Reproducir HLS: sistemas/reproduccion-video/eventos/reproducir-hls.md
              - 04 · Buscar otra posición: sistemas/reproduccion-video/eventos/buscar-posicion.md
