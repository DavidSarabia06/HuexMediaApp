site_name: Huex Media App
site_description: Documentación del servidor y del frontend
docs_dir: docs
site_dir: .docs-site
dev_addr: 127.0.0.1:8000

theme:
  name: material
  language: es
  font: false
  palette:
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Cambiar a tema claro
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Cambiar a tema oscuro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: es

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - scripts/docs_sources.py

