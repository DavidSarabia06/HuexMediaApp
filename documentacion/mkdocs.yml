site_name: Huex Media App
site_description: Documentación del servidor y del frontend
docs_dir: docs
site_dir: .docs-site
dev_addr: 127.0.0.1:8000

theme:
  name: material
  language: es
  font: false
  palette:
    - scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Cambiar a tema claro
    - scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Cambiar a tema oscuro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: es

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - scripts/docs_sources.py

extra:
  source_files:
    MoviesPage: huexmediaapp.client/src/Movies.jsx
    Subtitles: huexmediaapp.client/src/subtitles.js
    Settings: huexmediaapp.client/src/Settings.jsx
    Home: huexmediaapp.client/src/Home.jsx
    App: huexmediaapp.client/src/App.jsx
    Header: huexmediaapp.client/src/Header.jsx
    HeaderStyles: huexmediaapp.client/src/css/Header.css
    PlaybackProgressClient: huexmediaapp.client/src/playbackProgress.js
    HuexCard: huexmediaapp.client/src/HuexCard.jsx
    HuexCardStyles: huexmediaapp.client/src/css/HuexCard.css
    HuexCardMenu: huexmediaapp.client/src/HuexCardMenu.jsx
    SeriesCategoryRow: huexmediaapp.client/src/SeriesCategoryRow.jsx
    SeriesPage: huexmediaapp.client/src/Series.jsx
    SeriesDetail: huexmediaapp.client/src/SeriesDetail.jsx
    VideoPlayer: huexmediaapp.client/src/VideoPlayer.jsx
    VideoPlayerStyles: huexmediaapp.client/src/css/VideoPlayer.css
    SeriesCategoryService: HuexMediaApp.Server/Services/SeriesCategoryService.cs
    SeriesCategory: HuexMediaApp.Server/Models/SeriesCategory.cs
    SeriesCategoriesController: HuexMediaApp.Server/Controllers/SeriesCategoriesController.cs
    ConfigurationService: HuexMediaApp.Server/Services/ConfigurationService.cs
    ConfigurationRequest: HuexMediaApp.Server/Models/ConfigurationRequest.cs
    ConfigurationController: HuexMediaApp.Server/Controllers/ConfigurationController.cs
    SeriesService: HuexMediaApp.Server/Services/SeriesService.cs
    SeriesLibrary: HuexMediaApp.Server/Models/SeriesLibrary.cs
    SeriesController: HuexMediaApp.Server/Controllers/SeriesController.cs
    VideoService: HuexMediaApp.Server/Services/VideoService.cs
    HlsCleanupService: HuexMediaApp.Server/Services/HlsCleanupService.cs
