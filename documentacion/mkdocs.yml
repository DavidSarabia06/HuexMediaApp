    not_found: warn
    anchors: warn

nav:
  - Inicio: README.md
  - Frontend:
      - Visión general: frontend/README.md
      - Aplicación:
          - Estructura, rutas y temas: frontend/app.md
          - Código TSX: codigo/App.md
      - Hooks:
          - useLibraries:
              - Consulta de bibliotecas: frontend/hooks/use-libraries.md
              - Código TypeScript: codigo/UseLibraries.md
          - useCategories:
              - Gestión de categorías: frontend/hooks/use-categories.md
              - Código TypeScript: codigo/UseCategories.md
      - API:
          - Peticiones de bibliotecas y categorías: frontend/modulos/library-category-api.md
          - librariesApi: codigo/LibrariesApi.md
          - categoriesApi: codigo/CategoriesApi.md
      - Módulos:
          - categoryUtils:
              - Peticiones, elementos y destinos: frontend/modulos/category-utils.md
              - Código TypeScript: codigo/CategoryUtils.md
          - libraryUtils:
              - Consultas y selección recordada: frontend/modulos/library-utils.md
              - Código TypeScript: codigo/LibraryUtils.md
          - generalUtils:
              - Respuestas, rutas y tiempos: frontend/modulos/general-utils.md
              - Código TypeScript: codigo/GeneralUtils.md
          - subtitles:
              - Interpretación y pistas: frontend/modulos/subtitles.md
              - Código TypeScript: codigo/Subtitles.md
          - playbackProgress:
              - Funciones y guardado: frontend/modulos/playback-progress.md
              - Código TypeScript: codigo/PlaybackProgressClient.md
      - Páginas:
          - Movies:
              - Categorías y subcategorías: frontend/paginas/movies.md
              - Código TSX: codigo/MoviesPage.md
              - Utilidades generales: codigo/GeneralUtils.md
              - Utilidades de categorías: codigo/CategoryUtils.md
              - Consultas de bibliotecas: codigo/LibraryUtils.md
              - Opciones de profundidad: codigo/MoviesCategoryOptions.md
          - Settings:
              - Página de configuración: frontend/paginas/settings.md
              - Estilos CSS: codigo/SettingsStyles.md
              - Código TSX: codigo/Settings.md
          - Home:
              - Biblioteca y navegación: frontend/paginas/home.md
              - Código TSX: codigo/Home.md
          - Series:
              - Funcionamiento y propiedades: frontend/paginas/series.md
              - Código TSX: codigo/SeriesPage.md
          - SeriesDetail:
              - Funcionamiento y navegación: frontend/paginas/series-detail.md
              - Código TSX: codigo/SeriesDetail.md
          - VideoPlayer:
              - Funcionamiento y eventos: frontend/paginas/video-player.md
              - Código TSX: codigo/VideoPlayer.md
              - Estilos CSS: codigo/VideoPlayerStyles.md
      - Componentes:
          - Diálogos:
              - Formularios compartidos: frontend/componentes/dialogs.md
              - Código TSX: codigo/Dialogs.md
          - Densidad de biblioteca:
              - Tamaño de carátulas: frontend/componentes/library-density.md
              - Código del selector: codigo/LibraryCardSizeSelector.md
              - Código del hook: codigo/LibraryDensity.md
          - Header:
              - Funcionamiento y eventos: frontend/componentes/header.md
              - Código TSX: codigo/Header.md
              - Estilos CSS: codigo/HeaderStyles.md
          - HuexCard:
              - Funcionamiento y propiedades: frontend/componentes/huex-card.md
              - Código TSX: codigo/HuexCard.md
              - Estilos CSS: codigo/HuexCardStyles.md
          - HuexCardMenu:
              - Funcionamiento y propiedades: frontend/componentes/huex-card-menu.md
              - Código TSX: codigo/HuexCardMenu.md
          - SeriesCategoryRow:
              - Funcionamiento y propiedades: frontend/componentes/series-category-row.md
              - Código TSX: codigo/SeriesCategoryRow.md
          - Cambiar nombre de categorías:
              - Funcionamiento: frontend/componentes/dialogs.md
              - Código TSX: codigo/Dialogs.md
  - Sistemas:
      - Películas:
          - Visión general: sistemas/peliculas/README.md
          - Servicios:
              - Funciones y funcionamiento: sistemas/peliculas/servicios.md
              - Código de exploración: codigo/MoviesService.md
              - Código de categorías: codigo/CategoryService.md
          - Modelos:
              - Clases y propiedades: sistemas/peliculas/modelos.md
              - Código de película: codigo/MediaItem.md
              - Código de categorías: codigo/MediaCategory.md
              - Opciones de profundidad: codigo/MoviesCategoryOptions.md
          - Controladores:
              - Operaciones y respuestas: sistemas/peliculas/controladores.md
              - Código de exploración: codigo/MoviesController.md
              - Código de categorías: codigo/CategoriesController.md
      - Categorías de bibliotecas:
          - Visión general: sistemas/categorias/README.md
          - Servicio:
              - Funciones y funcionamiento: sistemas/categorias/servicio.md
              - Código fuente: codigo/CategoryService.md
              - Persistencia de bibliotecas: codigo/LibraryService.md
              - Cómo se recorre la biblioteca: sistemas/categorias/contenido-biblioteca.md
              - Código del recorrido: codigo/LibraryContentSnapshot.md
              - Almacenamiento JSON: codigo/JsonFileStoreService.md
          - Modelos:
              - Clases y propiedades: sistemas/categorias/modelos.md
              - Código fuente: codigo/MediaCategory.md
              - Biblioteca común: codigo/MediaLibrary.md
          - Controlador:
              - Operaciones y respuestas: sistemas/categorias/controlador.md
              - Código fuente: codigo/CategoriesController.md
      - Configuración:
          - Visión general: sistemas/configuracion/README.md
          - Servicio:
              - Funciones y funcionamiento: sistemas/configuracion/servicio.md
              - Código fuente: codigo/ConfigurationService.md
              - Código de rutas de almacenamiento: codigo/AppStoragePaths.md
          - Modelo:
              - Propiedades: sistemas/configuracion/modelos.md
              - Código fuente: codigo/ConfigurationRequest.md
          - Controlador:
              - Operaciones y respuestas: sistemas/configuracion/controlador.md
              - Código fuente: codigo/ConfigurationController.md
      - Exploración de series:
          - Visión general: sistemas/series/README.md
          - Servicio:
              - Funciones y funcionamiento: sistemas/series/servicio.md
              - Código fuente: codigo/SeriesService.md
          - Modelos:
              - Clases y propiedades: sistemas/series/modelos.md
              - Código fuente: codigo/MediaItem.md
          - Controlador:
